name: Release

on:
  push:
    tags:
      - 'v*'

# Least privilege at the top; the release job re-grants exactly what it needs.
permissions:
  contents: read

# Serialized, never cancelled. A publish that is interrupted between the two
# packages leaves the registry holding one half of a release, which the version
# gate then reads as already-published on the retry. See dev/REPO-STANDARDS.md
# STD-CI-6.
concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # write: creates the GitHub Release. id-token: mints the OIDC token the
      # npm provenance attestation requires. `pnpm publish --provenance` below
      # is what consumes it. STD-REL-3 and STD-REL-4.
      #
      # `pnpm publish --help` does not advertise --provenance, which makes it
      # look unsupported. It is not: pnpm 11 bundles libnpmpublish's
      # provenance.js and the flag reaches ensureProvenanceGeneration. pnpm 10
      # ignores it silently, so a repo copying this must be on 11 first.
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Enable Corepack and install pnpm
        run: corepack enable && corepack prepare --activate

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '25'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Hugo
        run: |
          HUGO_VERSION="0.152.2"
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin hugo

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version consistency
        run: ./scripts/check-versions.sh

      - name: Verify debut CHANGELOG entry
        run: |
          NAME="@rcrsr/rill-language-service"
          if npm view "$NAME" version &>/dev/null; then
            echo "$NAME already published; skipping debut CHANGELOG check."
            exit 0
          fi
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          # The debut entry may sit under "## Unreleased" (not yet dated) or
          # under the freshly-dated header for the version being released.
          SECTION=$(awk -v version="$VERSION" '
            /^## Unreleased/ { flag=1; next }
            $0 ~ "^## " version "( |$)" { flag=1; next }
            /^## / { flag=0 }
            flag
          ' CHANGELOG.md)
          if ! grep -q "$NAME" <<< "$SECTION"; then
            echo "Debut release detected for $NAME, but neither the Unreleased section nor the ${VERSION} section of CHANGELOG.md mentions it." >&2
            exit 1
          fi
          echo "Debut CHANGELOG entry for $NAME verified."

      - name: Build all packages
        run: pnpm -r run build

      - name: Run tests
        run: pnpm -r run test

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Without pipefail the `pnpm publish | tee` below reports tee's exit
          # status, so a failed publish would read as success and the job would
          # go on to cut a GitHub Release for packages that never shipped.
          # See dev/REPO-STANDARDS.md STD-REL-6.
          set -o pipefail
          for dir in packages/core packages/service; do
            dir="${dir%/}"
            [ -f "$dir/package.json" ] || continue
            PRIVATE=$(node -p "require('./$dir/package.json').private || false")
            [ "$PRIVATE" = "true" ] && continue
            NAME=$(node -p "require('./$dir/package.json').name")
            VERSION=$(node -p "require('./$dir/package.json').version")
            if npm view "${NAME}@${VERSION}" version &>/dev/null; then
              echo "Skipping $NAME@$VERSION (already published)"
              continue
            fi
            echo "Publishing $NAME@$VERSION..."
            cd "$dir"
            # The npm view check above races a concurrent publish: it can pass
            # while another run is mid-publish of the same version. Treat the
            # registry's own conflict response as already-published rather than
            # failing the job. STD-REL-5.
            PUBLISH_LOG=$(mktemp)
            if pnpm publish --provenance --access public --no-git-checks 2>&1 | tee "$PUBLISH_LOG"; then
              echo "Published $NAME@$VERSION"
            elif grep -Eqi '(EPUBLISHCONFLICT|E403|cannot publish over( the)? previously published versions|cannot modify pre-existing version)' "$PUBLISH_LOG"; then
              echo "Skipping $NAME@$VERSION (already published, confirmed by registry)"
            else
              echo "Failed to publish $NAME@$VERSION"
              cat "$PUBLISH_LOG"
              rm -f "$PUBLISH_LOG"
              exit 1
            fi
            rm -f "$PUBLISH_LOG"
            cd "$GITHUB_WORKSPACE"
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "GitHub Release '${{ github.ref_name }}' already exists. Skipping creation."
            exit 0
          fi
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
