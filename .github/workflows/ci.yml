name: CI

# No path filtering, deliberately. Both filtering mechanisms are incompatible
# with required status checks: `paths-ignore` prevents the run entirely, so a
# required context is never reported and the PR blocks forever; a job-level
# `if:` gate reports "skipped", which never satisfies a required context. See
# dev/REPO-STANDARDS.md STD-CI-7. Filtering `**/*.md` would also skip
# test:examples, which executes every rill snippet in docs/ and README.md.
#
# Every `uses:` in this repository pins a commit SHA with the release it belongs
# to in a trailing comment, per STD-CI-8. A major tag such as `@v5` is mutable:
# whoever controls the action repository can retarget it, and the next run
# executes different code with no diff here. The comment is what dependabot
# reads to offer an upgrade, so it must stay accurate when a SHA changes.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# Template source for the rill ecosystem. See dev/REPO-STANDARDS.md STD-CI-6.
# Keyed on the ref, so a force-push to a PR branch cancels the superseded run
# instead of leaving a 3-node matrix plus two more jobs racing the new one.
# `github.workflow` is in the group because a bare ref would collide with the
# other ref-keyed workflows on this repo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never on main: every push to main must leave a completed status behind, and
  # the branch-protection contexts are reported from this workflow.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22', '24', '25']

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm -r run check

  deps:
    name: Unused deps and exports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run knip
        run: pnpm check:deps

      - name: Check formatting
        run: pnpm check:format

      # Root-level, so `pnpm -r run check` never reaches it: -r excludes the
      # workspace root.
      - name: Test custom lint rules
        run: pnpm test:rules

  language-lock:
    name: Language arbiter lock
    runs-on: ubuntu-latest
    steps:
      # No fetch-depth: the lock compares against a committed snapshot, not a
      # base ref, so it needs no history and behaves the same on main.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Needs git, grep, and sha256sum only. The check job above already runs
      # the suite on 22/24/25, so this never runs it a second time.
      - name: Check language arbiter lock
        run: bash scripts/check-test-lock.sh
