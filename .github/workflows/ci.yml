name: CI

# No path filtering, deliberately. Both filtering mechanisms are incompatible
# with required status checks: `paths-ignore` prevents the run entirely, so a
# required context is never reported and the PR blocks forever; a job-level
# `if:` gate reports "skipped", which never satisfies a required context. See
# dev/REPO-STANDARDS.md STD-CI-7. Filtering `**/*.md` would also skip
# test:examples, which executes every rill snippet in docs/ and README.md.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22', '24', '25']

    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm -r run check

  deps:
    name: Unused deps and exports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run knip
        run: pnpm check:deps

      - name: Check formatting
        run: pnpm check:format

      # Root-level, so `pnpm -r run check` never reaches it: -r excludes the
      # workspace root.
      - name: Test custom lint rules
        run: pnpm test:rules

  language-lock:
    name: Language arbiter lock
    runs-on: ubuntu-latest
    steps:
      # No fetch-depth: the lock compares against a committed snapshot, not a
      # base ref, so it needs no history and behaves the same on main.
      - uses: actions/checkout@v5

      # Needs git, grep, and sha256sum only. The check job above already runs
      # the suite on 22/24/25, so this never runs it a second time.
      - name: Check language arbiter lock
        run: bash scripts/check-test-lock.sh
